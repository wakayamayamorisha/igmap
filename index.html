<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instagramマップ</title>
<style>
  /* ===== 色・寸法 ===== */
  :root {
    --ink: #1f2328;
    --muted: #5b636d;
    --paper: #ffffff;
    --line: #e3e6ea;
    --accent: #1a6b5a;        /* マーカーとボタンの色。好みで変更可 */
    --sheet-w: 420px;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    color: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); }

  #map { position: fixed; inset: 0; }

  /* ===== タイトル ===== */
  .title {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: 12px;
    z-index: 2;
    margin: 0;
    padding: 10px 14px;
    background: var(--paper);
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
    max-width: calc(100% - 80px);
  }
  .title small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }

  /* ===== 投稿パネル（スマホ：下から／PC：右側） ===== */
  .sheet {
    position: fixed;
    z-index: 3;
    left: 0; right: 0; bottom: 0;
    max-height: 72vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -2px 12px rgba(0,0,0,.2);
    transform: translateY(105%);
    transition: transform .25s ease;
  }
  .sheet.open { transform: translateY(0); }
  @media (min-width: 820px) {
    .sheet {
      left: auto; top: 0; width: var(--sheet-w); max-height: none;
      border-radius: 0;
      box-shadow: -2px 0 12px rgba(0,0,0,.2);
      transform: translateX(105%);
    }
    .sheet.open { transform: translateX(0); }
  }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }

  .sheet-head {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 16px 16px 12px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px) * var(--top-inset, 0));
    border-bottom: 1px solid var(--line);
  }
  @media (min-width: 820px) { .sheet-head { --top-inset: 1; } }
  .sheet-head h2 { margin: 0; font-size: 18px; line-height: 1.4; flex: 1; }
  .sheet-head p { margin: 4px 0 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
  .close {
    flex: none; width: 36px; height: 36px;
    border: 0; border-radius: 50%;
    background: #f0f2f4; color: var(--ink);
    font-size: 20px; line-height: 1; cursor: pointer;
  }
  .sheet-actions { padding: 10px 16px 0; }
  .sheet-actions a {
    display: inline-block; padding: 8px 14px;
    border: 1px solid var(--accent); border-radius: 18px;
    color: var(--accent); font-size: 14px; text-decoration: none;
  }
  .posts {
    overflow-y: auto;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    -webkit-overflow-scrolling: touch;
  }
  .posts .instagram-media { margin: 0 auto 16px !important; min-width: 0 !important; }
  .empty { color: var(--muted); font-size: 14px; }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ===== 設定エラー表示 ===== */
  .setup {
    position: fixed; inset: 0; z-index: 10;
    display: none; place-items: center; padding: 24px;
    background: #f6f7f8;
  }
  .setup.show { display: grid; }
  .setup div { max-width: 480px; line-height: 1.8; font-size: 15px; }
  .setup code { background: #e8eaed; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

<div id="map" role="application" aria-label="地図"></div>
<h1 class="title" id="title"></h1>

<aside class="sheet" id="sheet" aria-hidden="true" aria-labelledby="spot-name">
  <div class="sheet-head">
    <div style="flex:1">
      <h2 id="spot-name"></h2>
      <p id="spot-note"></p>
    </div>
    <button class="close" id="close" aria-label="閉じる">×</button>
  </div>
  <div class="sheet-actions"><a id="gmaps-link" target="_blank" rel="noopener">Googleマップで開く</a></div>
  <div class="posts" id="posts"></div>
</aside>

<div class="setup" id="setup"><div id="setup-msg"></div></div>

<script>
/* =========================================================
   ここだけ編集すればOK
   ========================================================= */
const CONFIG = {
  title: "マップのタイトル",
  subtitle: "地点をタップするとInstagramの投稿が見られます",

  // Google CloudのAPIキー（公開先ドメインに制限をかけること）
  apiKey: "AIzaSyBDJIBsUs5Hl8DaeyBK5NJ2tV1m1Z-WSns",

  // マップID（Google Cloudで作成。テスト中は "DEMO_MAP_ID" でも動きます）
  mapId: "DEMO_MAP_ID",

  // 地点データ
  //   id   : 半角英数字。共有URLの末尾（#id）に使われます
  //   lat/lng : Googleマップで地点を右クリック → 数字をクリックでコピーできます
  //   ig   : Instagram投稿のURL（複数可）
  //   note : 一言メモ（省略可）
  spots: [
    {
      id: "sample-1",
      name: "サンプル地点A",
      lat: 34.2306, lng: 135.1708,
      note: "ここに一言メモ",
      ig: ["https://www.instagram.com/p/XXXXXXXXXXX/"]
    },
    {
      id: "sample-2",
      name: "サンプル地点B",
      lat: 34.2260, lng: 135.1675,
      ig: [
        "https://www.instagram.com/p/YYYYYYYYYYY/",
        "https://www.instagram.com/reel/ZZZZZZZZZZZ/"
      ]
    }
  ]
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const IG_PATTERN = /^https:\/\/www\.instagram\.com\/(p|reel|tv)\/[A-Za-z0-9_-]+\/?/;

$("title").innerHTML = `${esc(CONFIG.title)}<small>${esc(CONFIG.subtitle)}</small>`;
document.title = CONFIG.title;

function showSetup(html) {
  $("setup-msg").innerHTML = html;
  $("setup").classList.add("show");
}

if (!CONFIG.apiKey || CONFIG.apiKey === "YOUR_API_KEY") {
  showSetup("地図を表示するにはAPIキーが必要です。HTML内の <code>apiKey</code> に、Google Cloudで発行したMaps JavaScript APIのキーを入れてください。");
} else {
  /* Google公式の読み込みスクリプト */
  (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({ key: CONFIG.apiKey, v: "weekly", language: "ja", region: "JP" });

  window.gm_authFailure = () =>
    showSetup("APIキーが認証されませんでした。キーが正しいか、Maps JavaScript APIが有効か、リファラー制限にこのページのドメインが含まれているかを確認してください。");

  init().catch(err => {
    console.error(err);
    showSetup("地図を読み込めませんでした。ネットワーク接続とAPIキーの設定を確認してください。");
  });
}

/* Instagram埋め込みスクリプト（1回だけ読み込む） */
function loadInstagram() {
  if (document.querySelector('script[src*="instagram.com/embed.js"]')) return;
  const s = document.createElement("script");
  s.async = true;
  s.src = "https://www.instagram.com/embed.js";
  document.body.appendChild(s);
}

async function init() {
  const { Map } = await google.maps.importLibrary("maps");
  const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");

  const map = new Map($("map"), {
    mapId: CONFIG.mapId,
    center: { lat: CONFIG.spots[0]?.lat ?? 34.23, lng: CONFIG.spots[0]?.lng ?? 135.17 },
    zoom: 14,
    gestureHandling: "greedy",
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false
  });

  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  const bounds = new google.maps.LatLngBounds();
  const byId = {};

  CONFIG.spots.forEach(spot => {
    const pin = new PinElement({ background: accent, borderColor: "#ffffff", glyphColor: "#ffffff" });
    const marker = new AdvancedMarkerElement({
      map, position: { lat: spot.lat, lng: spot.lng },
      title: spot.name, content: pin.element, gmpClickable: true
    });
    marker.addListener("click", () => openSpot(spot, map, true));
    bounds.extend(marker.position);
    byId[spot.id] = spot;
  });

  if (CONFIG.spots.length > 1) map.fitBounds(bounds, 60);

  $("close").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  // 共有URL（…/#sample-1）で開いたら、その地点を表示
  const openFromHash = () => {
    const spot = byId[decodeURIComponent(location.hash.slice(1))];
    if (spot) openSpot(spot, map, false);
  };
  window.addEventListener("hashchange", openFromHash);
  openFromHash();
}

function openSpot(spot, map, updateHash) {
  $("spot-name").textContent = spot.name;
  $("spot-note").textContent = spot.note || "";
  $("spot-note").hidden = !spot.note;
  $("gmaps-link").href = `https://www.google.com/maps/search/?api=1&query=${spot.lat},${spot.lng}`;

  const urls = (spot.ig || []).filter(u => IG_PATTERN.test(u));
  $("posts").innerHTML = urls.length
    ? urls.map(u => `<blockquote class="instagram-media" data-instgrm-permalink="${esc(u)}" data-instgrm-version="14" style="width:100%;max-width:540px"><a href="${esc(u)}" target="_blank" rel="noopener">Instagramで見る</a></blockquote>`).join("")
    : `<p class="empty">この地点の投稿はまだありません。</p>`;

  loadInstagram();
  window.instgrm?.Embeds.process();

  const sheet = $("sheet");
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden", "false");
  $("posts").scrollTop = 0;
  map.panTo({ lat: spot.lat, lng: spot.lng });

  if (updateHash && spot.id) history.replaceState(null, "", "#" + encodeURIComponent(spot.id));
}

function closeSheet() {
  const sheet = $("sheet");
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden", "true");
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}
</script>
</body>
</html>
