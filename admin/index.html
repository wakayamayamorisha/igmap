<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>投稿管理 — igmap</title>
<style>
  :root { --ink:#1f2328; --muted:#5b636d; --line:#e3e6ea; --accent:#1a6b5a; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    background:#f6f7f8; color:var(--ink); line-height:1.8;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  }
  .box { max-width:420px; width:100%; background:#fff; border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { margin:0 0 8px; font-size:18px; }
  p { margin:0 0 16px; font-size:14px; color:var(--muted); }
  a.btn {
    display:block; text-align:center; padding:13px 20px; border-radius:999px;
    background:var(--accent); color:#fff; font-weight:600; text-decoration:none;
  }
  a.back { display:inline-block; margin-top:16px; font-size:13px; color:var(--accent); }
</style>
</head>
<body>
  <div class="box">
    <h1>投稿管理画面へ</h1>
    <p>Googleアカウントでのログインが必要です。許可されたアカウントだけが使えます。</p>
    <a class="btn" id="go" href="#">投稿管理画面を開く</a>
    <a class="back" href="../">← 地図に戻る</a>
  </div>
<script>
  // GASウェブアプリのURL（deploy.sh のDeployment IDと対応）
  var ADMIN_URL = "https://script.google.com/macros/s/AKfycby9xK0iJ4A0VXqgDe-JL_ZAB4o2FsPtXV7QkuFWkpdh-epX2p2sy3m86Naj6IK56qK1/exec";
  document.getElementById("go").href = ADMIN_URL;
  location.replace(ADMIN_URL);
</script>
</body>
</html>
